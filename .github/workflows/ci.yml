name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  file-length:
    name: File length
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: scripts/check-file-length.sh

  pii:
    name: PII check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: scripts/check-pii.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run shellcheck (shellcheck is preinstalled on ubuntu-latest)
        run: |
          mapfile -d '' -t files < <(git ls-files -z '*.sh' ':!:.claude/skills/*')
          files+=(.githooks/pre-commit)
          shellcheck --version
          shellcheck "${files[@]}"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash scripts/test.sh

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements-test.txt
      # Collects every tests/**/test_*.py; deps come from requirements-test.txt only.
      - run: uv run --with-requirements requirements-test.txt python -m pytest -q tests

  # Stack job: added at kickoff (format check, lint, typecheck, test, build), with the same
  # commands as AGENTS.md. Pin every third-party action by commit SHA and keep permissions read-only.
