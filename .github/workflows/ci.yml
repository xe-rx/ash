name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  file-length:
    name: File length
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-file-length.sh

  pii:
    name: PII check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-pii.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck (shellcheck is preinstalled on ubuntu-latest)
        run: |
          mapfile -d '' -t files < <(git ls-files -z '*.sh' ':!:.claude/skills/*')
          files+=(.githooks/pre-commit)
          shellcheck --version
          shellcheck "${files[@]}"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node core tests (tests/test_core.sh) run inside scripts/test.sh. The package.json arrives
      # with the core; the guards keep this workflow valid before then. scripts/test.sh itself
      # fails (never skips) if package.json exists but node_modules does not.
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install Node dependencies
        if: hashFiles('package.json') != ''
        run: npm ci --ignore-scripts
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Qt 5.11 toolchain (for the QML tests)
        run: scripts/setup-qt.sh
      - run: bash scripts/test.sh
        env:
          REQUIRE_QT: '1'

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: requirements-test.txt
      # Collects every tests/**/test_*.py; deps come from requirements-test.txt only.
      - run: uv run --with-requirements requirements-test.txt python -m pytest -q tests

  # Stack job: same commands as AGENTS.md "Dev commands". The QML view and its build/lint commands
  # (if any beyond the Qt 5.11 parse check) are added when they exist.
  ash-rules:
    name: Ash rules and QML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-ash-rules.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Qt 5.11 toolchain
        run: scripts/setup-qt.sh
      - run: scripts/check-qml.sh
